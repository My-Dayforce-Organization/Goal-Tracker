version: '3.9'
services:
  backend:
    build: ./backend
    container_name: milestone-backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend/app/data:/app/app/data

  frontend:
    build: ./frontend
    container_name: milestone-frontend
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - '5173:5173'
    depends_on:
      - backend
