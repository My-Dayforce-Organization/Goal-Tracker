version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: goaltracker
      POSTGRES_USER: goal
      POSTGRES_PASSWORD: goal
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"